name: Auto-merge claude/ branches to main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node is set up BEFORE the merge step so the syntax gate can run inside it,
      # between `git merge` and `git push origin main`. It has to run on the MERGE
      # RESULT, not on the branch: 186af122 combined the same block from both of
      # its parents, and the unparseable file existed on neither side. No check of
      # the branch — and no other workflow, since this one pushes without waiting
      # for any of them — could have seen it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge to main and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          # Already merged? Then the branch is redundant — delete it and stop.
          # (Leaving merged claude/* branches around is what lets local worktrees
          #  accumulate, which has corrupted node_modules via worktree juggling.)
          if git merge-base --is-ancestor origin/${{ github.ref_name }} origin/main; then
            echo "Branch already merged into main — deleting it"
            git push origin --delete ${{ github.ref_name }} || true
            exit 0
          fi

          git checkout main
          git merge origin/${{ github.ref_name }} --no-edit

          # SYNTAX GATE — the last moment before main becomes deployable.
          # The merge is still local here, so a failure costs nothing: main is
          # untouched and the branch is NOT deleted, so the work is safe and the
          # author can fix the file and push again.
          if ! node tools/check-service-syntax.cjs --all; then
            echo "::error::Syntax gate FAILED on the merge result — refusing to push to main."
            echo "Merging ${{ github.ref_name }} into main produces a file node cannot parse."
            echo "main is unchanged and the branch is kept. Fix the syntax error and push again."
            exit 1
          fi

          git push origin main

          # Merge confirmed on main (push succeeded) — now delete the branch so it
          # can't linger and spawn a stale local worktree. --delete is safe here:
          # the work is on main. Tolerate a missing branch (|| true).
          echo "Merged ${{ github.ref_name }} → main; deleting the branch"
          git push origin --delete ${{ github.ref_name }} || true
