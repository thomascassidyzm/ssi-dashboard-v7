# The explainer drift gate, authoritative in CI (founder ruling 2026-07-27).
# The compiler is dependency-free node — no npm install needed. If a surface,
# gate, role, docs tab or glossary pointer changes without the pack/rulings
# following, this fails the push.
name: Explainer drift gate

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drift gate (--check)
        run: node tools/explainer/compile.mjs --check
      # Added 2026-08-08 after merge 186af122 put two `const MIN_TAKE_MS` in one
      # scope of services/production-api.cjs and shipped an unparseable file to
      # main. Both parents parsed; the merge did not. It sat there until the
      # service next restarted, then crash-looped and turned every dot in the
      # popty.app env switcher red. This is the only gate workflow on the repo
      # and it needs no npm install, so the syntax check rides along here rather
      # than becoming a second mechanism to keep alive.
      - name: Service entrypoint syntax gate
        run: node tools/check-service-syntax.cjs
      # The Vue template-symbol gate (tools/check-vue-template-symbols.cjs) used to run here.
      # Moved 2026-08-31 to a watson-1 nightly cron job (ops/vue-template-symbol-sentinel.sh)
      # because GitHub Actions stays permanently OFF on this repo (Tom's ruling) — this
      # workflow never runs on push/PR, so the step below never ran either. See that script's
      # header for the incident it exists to catch.
