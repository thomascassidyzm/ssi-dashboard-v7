<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sascha — every take</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #8a8a8e;
    --line: #e4e2dd; --good: #2e9e5b; --bad: #d64545; --accent: #3b6fe0;
    --warn: #b06a00; --live: #b06a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #212126; --ink: #ececf0; --muted: #8f8f96;
      --line: #313138; --good: #3fb56e; --bad: #e05c5c; --accent: #6c96f0;
      --warn: #e0a458; --live: #e0a458;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .counts { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .counts .g { color: var(--good); }
  .counts .b { color: var(--bad); }
  .counts .u { color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .ig { background: var(--good); }
  .bar .ib { background: var(--bad); }
  .note { font-size: 11px; color: var(--warn); line-height: 1.4; }
  /* The inference disclosure. Deliberately not styled as a footnote: the flow
     split is a guess made from the shape of the data, and it sits next to the
     control that acts on it. */
  .inferred {
    font-size: 11px; line-height: 1.45; color: var(--muted);
    border: 1px dashed var(--muted); border-radius: 8px; padding: 6px 8px;
  }
  .inferred b { color: var(--warn); }
  .inferred details { margin-top: 4px; }
  .inferred summary { cursor: pointer; color: var(--accent); }
  .filters { display: flex; gap: 8px; }
  .filters + .filters { margin-top: 0; }
  .filters button, .filters a {
    flex: 1; min-height: 44px; font: inherit; font-size: 14px;
    color: var(--ink); background: var(--card); text-decoration: none;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  main { padding: 10px 12px 40px; display: flex; flex-direction: column; gap: 12px; }
  .grp {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .grp.retry { border-left: 4px solid var(--warn); }
  .grp.pinned { border: 2px solid var(--bad); }
  .pinnote {
    font-size: 12px; line-height: 1.45; color: var(--bad);
    border: 1px solid var(--bad); border-radius: 8px; padding: 6px 8px;
  }
  .grp.refused { border-left: 4px solid var(--muted); }
  .take-meta .flow { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .take-meta .flow.spliced { color: var(--muted); }
  .grp-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted); letter-spacing: .03em;
  }
  .grp-meta .rank { margin-left: auto; opacity: .55; font-variant-numeric: tabular-nums; }
  .grp-meta .flag { color: var(--warn); font-weight: 700; }
  .asked { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .prompted { font-size: 20px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .slotdiff {
    font-size: 12px; color: var(--bad); line-height: 1.4; overflow-wrap: anywhere;
    border: 1px solid var(--bad); border-radius: 8px; padding: 6px 8px;
  }

  .take {
    border-top: 1px solid var(--line); padding-top: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .take-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .take-meta .live { color: var(--live); font-weight: 700; }
  .take-meta .slow { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .heard { font-size: 12.5px; color: var(--muted); font-style: italic; line-height: 1.4; overflow-wrap: anywhere; }

  .btns { display: flex; gap: 8px; }
  .btns button {
    min-height: 48px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .btns .play { flex: 1.4; }
  .btns .play.playing { border-color: var(--accent); color: var(--accent); }
  .btns .v { flex: 1; }
  .btns .v.good[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
  .btns .v.bad[aria-pressed="true"]  { background: var(--bad);  border-color: var(--bad);  color: #fff; }
  .take.v-good { border-left: 3px solid var(--good); padding-left: 8px; }
  .take.v-bad  { border-left: 3px solid var(--bad);  padding-left: 8px; }

  .more { text-align: center; padding: 14px 0 30px; }
  .more button {
    min-height: 48px; padding: 0 22px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="counts" id="counts">loading…</div>
  <div class="bar"><i class="ig" id="bar-g" style="width:0"></i><i class="ib" id="bar-b" style="width:0"></i></div>
  <div class="note" id="note"></div>
  <div class="filters" id="flow-filters">
    <button id="w-continuous" aria-pressed="true">Start-to-finish</button>
    <button id="w-spliced" aria-pressed="false">Spliced</button>
    <button id="w-every" aria-pressed="false">Every take</button>
  </div>
  <div class="inferred" id="inferred"></div>
  <div class="filters">
    <button id="f-all" aria-pressed="true">All</button>
    <button id="f-retry" aria-pressed="false">Retried</button>
    <button id="f-todo" aria-pressed="false">Unjudged</button>
    <a id="export" href="/api/export">Export</a>
  </div>
  <div class="filters">
    <button id="apply" style="flex:2">Add my Good takes to the course…</button>
  </div>
</header>
<main id="list"><div class="empty">loading…</div></main>

<script>
// NOTHING IS PRELOADED. One <audio> element, its src set only on tap, so opening
// this on mobile data costs one JSON fetch and no audio at all. Lines are paged
// PAGE at a time so the DOM stays small on a phone.
const PAGE = 12;
// flow: which recording flow is being reviewed. 'continuous' is the default
// because that is the only flow Kai asked to spend his ear on — the spliced
// takes are one tap away, never gone.
const state = { groups: [], verdicts: {}, filter: 'all', flow: 'continuous', playing: null, shown: PAGE, total: 0, meta: null };
const audio = new Audio();
audio.preload = 'none';
audio.addEventListener('ended', () => setPlaying(null));

function setPlaying(uuid) {
  state.playing = uuid;
  document.querySelectorAll('.play').forEach((b) => b.classList.toggle('playing', b.dataset.uuid === uuid));
}

function play(uuid) {
  if (state.playing === uuid) { audio.pause(); audio.currentTime = 0; setPlaying(null); return; }
  audio.pause();
  audio.src = '/api/audio/' + uuid;
  audio.currentTime = 0;
  audio.play().then(() => setPlaying(uuid)).catch(() => setPlaying(null));
}

async function judge(uuid, verdict) {
  const current = state.verdicts[uuid]?.verdict;
  const next = current === verdict ? null : verdict;   // tapping the same verdict clears it
  // Optimistic, so the tap feels instant on a slow connection; the server
  // response is authoritative and overwrites it a moment later.
  if (next == null) delete state.verdicts[uuid];
  else state.verdicts[uuid] = { verdict: next, at: new Date().toISOString() };
  render();
  const res = await fetch('/api/verdict', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uuid, verdict: next }),
  });
  const body = await res.json();
  if (body.verdicts) { state.verdicts = body.verdicts; render(); }
}

// A take is in scope when it belongs to the flow being reviewed. Refused takes
// (no provenance row, so no inferable flow) and the pinned defect are always in
// scope — they are the two things that must not be filtered out of sight.
function inScope(t, grp) {
  if (grp && (grp.refused_group || grp.pinned)) return true;
  if (state.flow === 'every') return true;
  return t.flow === state.flow;
}

function scopedTakes() {
  return state.groups.flatMap((g) => g.takes.filter((t) => inScope(t, g)));
}

function counts() {
  const scoped = scopedTakes();
  let g = 0, b = 0;
  for (const t of scoped) {
    const v = state.verdicts[t.uuid]?.verdict;
    if (v === 'good') g++; else if (v === 'bad') b++;
  }
  return { g, b, u: scoped.length - g - b, total: scoped.length };
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

// "08-21 13:13:12" — date and time both matter, because the whole pattern is a
// good read and a flubbed retry seconds apart.
function stamp(iso) {
  const s = String(iso || '').replace('T', ' ');
  return s.slice(5, 19);
}

function visible() {
  // Flow first: a group with nothing in the flow being reviewed is not shown at
  // all. Then the existing All / Retried / Unjudged filter, applied to the
  // takes that survived.
  let gs = state.groups.filter((g) => g.takes.some((t) => inScope(t, g)));
  if (state.filter === 'retry') {
    gs = gs.filter((g) => g.takes.filter((t) => inScope(t, g) && t.cadence !== 'slow').length > 1);
  }
  if (state.filter === 'todo') {
    gs = gs.filter((g) => g.takes.some((t) => inScope(t, g) && !state.verdicts[t.uuid]));
  }
  return gs;
}

function renderTake(t, prevAt) {
  const v = state.verdicts[t.uuid]?.verdict || null;
  const gap = prevAt ? Math.round((new Date(t.recorded_at) - new Date(prevAt)) / 1000) : null;
  // The flow tag is only worth the space when it is NOT the flow being
  // reviewed — otherwise every take in a filtered list carries the same badge.
  const flowTag = (state.flow === 'every' || t.flow !== state.flow)
    ? `<span class="flow ${t.flow === 'spliced' ? 'spliced' : ''}">${
        t.flow === 'continuous' ? 'start-to-finish (inferred)'
        : t.flow === 'spliced' ? 'spliced (inferred)'
        : t.refused ? 'refused before it was recorded — flow unknown'
        : 'flow unknown'}</span>`
    : '';
  const bits = [
    `<span>${esc(stamp(t.recorded_at))}</span>`,
    gap != null && gap >= 0 && gap < 3600 ? `<span>+${gap}s</span>` : '',
    flowTag,
    // For a refused take the only clue about where it came from is WHEN it
    // landed in the bucket. Stated as the timing fact it is, never as a flow.
    t.refused && t.session
      ? `<span class="flow">uploaded ${/continuous/.test(t.session) ? 'during a start-to-finish session'
          : /spliced/.test(t.session) ? 'during a spliced session' : 'outside every recorded session'}</span>`
      : '',
    t.cadence === 'slow' ? '<span class="slow">slow read — never used as a clip</span>' : '',
    t.is_live ? '<span class="live">▶ THIS IS WHAT LEARNERS HEAR</span>' : '',
    t.superseded ? '<span>marked superseded</span>' : '',
  ].filter(Boolean).join(' ');
  return `
    <div class="take ${v ? 'v-' + v : ''}">
      <div class="take-meta">${bits}</div>
      ${t.decode ? `<div class="heard">machine heard: ${esc(t.decode)}</div>` : ''}
      <div class="btns">
        <button class="play" data-uuid="${t.uuid}" data-act="play">▶ Play</button>
        <button class="v good" data-uuid="${t.uuid}" data-act="good" aria-pressed="${v === 'good'}">Good</button>
        <button class="v bad"  data-uuid="${t.uuid}" data-act="bad"  aria-pressed="${v === 'bad'}">Bad</button>
      </div>
    </div>`;
}

function render() {
  const { g, b, u, total } = counts();
  // "in view" rather than naming the flow: the pinned defect and the refused
  // takes are always shown whatever the filter says, so this number is a couple
  // higher than the flow's own count and should not claim to be it.
  document.getElementById('counts').innerHTML =
    `<span>${g + b} of ${total} takes in view</span> · <span class="g">good ${g}</span> · <span class="b">bad ${b}</span> · <span class="u">to go ${u}</span>`;
  document.getElementById('bar-g').style.width = (total ? (g / total) * 100 : 0) + '%';
  document.getElementById('bar-b').style.width = (total ? (b / total) * 100 : 0) + '%';

  const list = document.getElementById('list');
  const all = visible();
  const shown = all.slice(0, state.shown);
  if (!shown.length) { list.innerHTML = '<div class="empty">nothing here</div>'; return; }

  list.innerHTML = shown.map((grp, i) => {
    const mine = grp.takes.filter((t) => inScope(t, grp));
    const hiddenHere = grp.takes.length - mine.length;
    const flags = [
      // "takes of this line" is meaningless for the refused group: they are not
      // a line, they are 31 orphans.
      grp.has_retry && !grp.refused_group ? `<span class="flag">${grp.natural_count} takes of this line</span>` : '',
      grp.live_count === 0 && !grp.refused_group ? '<span class="flag">not used in the course</span>' : '',
      hiddenHere ? `<span>${hiddenHere} more in the other flow</span>` : '',
    ].filter(Boolean).join(' ');
    const diff = grp.disagree_count
      ? `<div class="slotdiff">The course slot this was filed into says something else: “${esc(grp.takes.find((t) => t.text_disagrees).slot_text)}”</div>`
      : '';
    let prevAt = null;
    const takes = mine.map((t) => { const h = renderTake(t, prevAt); prevAt = t.recorded_at; return h; }).join('');
    // The refused group has no prompted line, because nothing was ever written
    // down about what was being read. Say that instead of showing an empty slot.
    const heading = grp.refused_group
      ? `<div class="asked">refused before anything was recorded</div>
         <div class="prompted">We do not know which line these were</div>
         <div class="pinnote">These ${grp.takes.length} takes were rejected by the upload gate before a single word about them reached the database — no prompted line, no cadence, no session. They exist only as audio in the bucket. They are here so nothing Sascha recorded is invisible; there is nothing to point them at in the course, so a verdict on one is a note, not a swap.</div>`
      : `<div class="asked">Sascha was asked to say</div>
         <div class="prompted">${esc(grp.prompted_text)}</div>`;
    return `
      <div class="grp ${grp.has_retry ? 'retry' : ''} ${grp.pinned ? 'pinned' : ''} ${grp.refused_group ? 'refused' : ''}">
        <div class="grp-meta">
          ${grp.seed != null ? `<span>seed ${esc(grp.seed)}</span>` : ''}
          ${flags}
          <span class="rank">#${i + 1}</span>
        </div>
        ${grp.pinned ? `<div class="pinnote">${esc(grp.pinned_note || 'Known live defect.')}</div>` : ''}
        ${heading}
        ${diff}
        ${takes}
      </div>`;
  }).join('');

  if (all.length > shown.length) {
    list.insertAdjacentHTML('beforeend',
      `<div class="more"><button id="more">Show ${Math.min(PAGE, all.length - shown.length)} more lines (${shown.length}/${all.length})</button></div>`);
    document.getElementById('more').onclick = () => { state.shown += PAGE; render(); };
  }
  setPlaying(state.playing);
}

document.getElementById('list').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !b.dataset.act) return;
  if (b.dataset.act === 'play') play(b.dataset.uuid);
  else judge(b.dataset.uuid, b.dataset.act);
});

function setFilter(f) {
  state.filter = f; state.shown = PAGE;
  for (const [id, name] of [['f-all', 'all'], ['f-retry', 'retry'], ['f-todo', 'todo']]) {
    document.getElementById(id).setAttribute('aria-pressed', String(f === name));
  }
  render();
}
document.getElementById('f-all').onclick = () => setFilter('all');
document.getElementById('f-retry').onclick = () => setFilter('retry');
document.getElementById('f-todo').onclick = () => setFilter('todo');

function setFlow(f) {
  state.flow = f; state.shown = PAGE;
  for (const [id, name] of [['w-continuous', 'continuous'], ['w-spliced', 'spliced'], ['w-every', 'every']]) {
    document.getElementById(id).setAttribute('aria-pressed', String(f === name));
  }
  render();
}
document.getElementById('w-continuous').onclick = () => setFlow('continuous');
document.getElementById('w-spliced').onclick = () => setFlow('spliced');
document.getElementById('w-every').onclick = () => setFlow('every');

// ---- adding Good takes to the course ----
// Two steps on purpose: the plan is read back from the live database and shown
// before anything is written, and only takes Kai has explicitly marked Good ever
// appear in it.
async function applyFlow() {
  const btn = document.getElementById('apply');
  btn.disabled = true; btn.textContent = 'checking…';
  try {
    const plan = await (await fetch('/api/apply-plan')).json();
    btn.disabled = false; btn.textContent = 'Add my Good takes to the course…';
    if (!plan.actions?.length) {
      alert(`Nothing to add.\n\n${plan.summary || 'No Good verdict yet points at a take that is not already what learners hear.'}`);
      return;
    }
    const lines = plan.actions.slice(0, 12).map((a) => `• ${a.prompted_text}`).join('\n');
    const extra = plan.actions.length > 12 ? `\n…and ${plan.actions.length - 12} more` : '';
    const skipped = plan.skipped?.length ? `\n\n${plan.skipped.length} judged take(s) cannot be applied: ${[...new Set(plan.skipped.map((s) => s.why))].join('; ')}.` : '';
    if (!confirm(`Change ${plan.actions.length} line(s) in the live course so learners hear the take you marked Good:\n\n${lines}${extra}${skipped}\n\nNothing is deleted and every change is reversible.`)) return;
    btn.disabled = true; btn.textContent = 'applying…';
    const res = await fetch('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
    const out = await res.json();
    btn.disabled = false; btn.textContent = 'Add my Good takes to the course…';
    alert(out.error
      ? `Nothing was changed: ${out.error}`
      : `${out.applied} line(s) now play your Good take. ${out.failed || 0} failed.\n\nBatch ${out.batch} — reversible in one command.`);
    location.reload();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Add my Good takes to the course…';
    alert('Could not reach the server: ' + e.message);
  }
}
document.getElementById('apply').onclick = applyFlow;

fetch('/api/takes').then((r) => r.json()).then((d) => {
  state.groups = d.groups; state.verdicts = d.verdicts || {}; state.total = d.total_takes; state.meta = d;
  const retried = d.groups.filter((x) => x.has_retry).length;
  const f = d.flow || {};
  document.getElementById('w-continuous').textContent = `Start-to-finish (${f.continuous ?? '?'})`;
  document.getElementById('w-spliced').textContent = `Spliced (${f.spliced ?? '?'})`;
  document.getElementById('w-every').textContent = `Every take (${d.total_takes})`;
  document.getElementById('inferred').innerHTML =
    `<b>The start-to-finish / spliced split is INFERRED, not recorded.</b> Nothing in the database says which flow produced a take — `
    + `there is no mode column, and the reading order Sascha chose is never sent with the upload. `
    + `${f.continuous ?? '?'} takes are read as start-to-finish and ${f.spliced ?? '?'} as spliced. Confidence: high, but it is a deduction.`
    + `<details><summary>the exact rule, and why I believe it</summary>`
    + `<div>${esc(f.rule || '')}</div><div style="margin-top:4px">${esc(f.basis || '')}</div>`
    + `<div style="margin-top:4px">${esc(f.confidence || '')}</div></details>`;
  document.getElementById('note').textContent =
    `${d.total_takes} takes over ${d.total_lines} lines — ${d.total_takes - d.live_takes} of them are invisible from the course side`
    + `${d.refused_takes ? `, and ${d.refused_takes} more were refused before the database heard about them at all` : ''}. `
    + `Nothing here was ever accepted: there is no acceptance flag in the database, so your ear is the only gate. `
    + `${retried} lines were recorded more than once — that is where a good read followed by a flubbed retry hides.`;
  render();
});
</script>
</body>
</html>
