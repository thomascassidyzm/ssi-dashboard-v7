# THE ONE SWITCH: point this QA unit at the restored-backup copy. The file is written by tools/qa-copy/refresh.sh only after a
# good restore; the leading "-" makes it optional, so if it is absent the unit reads live as before.
[Unit]
After=ssi-qa-copy-pg.service
Wants=ssi-qa-copy-pg.service

[Service]
EnvironmentFile=-%h/ssi-restore/qa-copy.env
