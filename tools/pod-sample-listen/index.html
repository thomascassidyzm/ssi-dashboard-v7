<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod casting — listen and rule</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a;
    --ink: #e8eaed; --dim: #9aa3af;
    --ok: #3fb950; --no: #f85149; --maybe: #d29922; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: var(--dim); font-size: 14px; margin: 0 0 20px; max-width: 60ch; }
  .course { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; margin-bottom: 20px; }
  .course > h2 { font-size: 18px; margin: 0 0 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cast { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .voice { font-size: 13px; border: 1px solid var(--line); border-radius: 999px;
           padding: 3px 10px; background: #22262d; }
  .voice b { font-weight: 600; }
  .voice .meta { color: var(--dim); }
  .warn { color: var(--maybe); font-size: 13px; margin: 6px 0 0; }
  .bad { color: var(--no); font-size: 13px; margin: 6px 0 0; }
  .stats { color: var(--dim); font-size: 13px; margin: 8px 0 14px; }
  .clip { border-top: 1px solid var(--line); padding: 12px 0; }
  .clip .who { color: var(--accent); font-size: 13px; font-weight: 600; }
  .clip .tgt { font-size: 17px; margin: 2px 0; }
  .clip .knw { color: var(--dim); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line);
           background: #262b33; color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .play { min-width: 108px; }
  .play.on { border-color: var(--accent); color: var(--accent); }
  .tag { font-size: 12px; color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  .verdict { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .verdict button.approve.on { border-color: var(--ok); color: var(--ok); }
  .verdict button.reject.on { border-color: var(--no); color: var(--no); }
  .verdict button.unsure.on { border-color: var(--maybe); color: var(--maybe); }
  .verdict .state { font-size: 13px; color: var(--dim); }
  .note { flex: 1 1 220px; min-width: 200px; background: #22262d; border: 1px solid var(--line);
          color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; }
</style>
</head>
<body>
<h1>Pod casting — listen and rule</h1>
<p class="lede">
  A pod should be a two-hander: one male voice, one female voice, in the right language.
  Play a few, then rule on the casting. Nothing is generated in bulk until you do.
</p>
<div id="out">Loading…</div>

<script>
let current = null; // the one playing audio element

function play(btn, url) {
  if (current && !current.paused) {
    current.pause();
    if (current._btn) { current._btn.classList.remove('on'); current._btn.textContent = current._btn._label; }
    if (current._src === url) { current = null; return; }
  }
  const a = new Audio(url);
  a._btn = btn; a._src = url;
  btn._label = btn._label || btn.textContent;
  btn.classList.add('on'); btn.textContent = '■ playing';
  a.onended = a.onerror = () => { btn.classList.remove('on'); btn.textContent = btn._label; };
  a.play().catch(() => { btn.classList.remove('on'); btn.textContent = 'failed'; });
  current = a;
}

function voiceChip(v) {
  const loc = v.locale ? `· ${v.locale}` : '';
  return `<span class="voice"><b>${v.name || v.voice_id}</b>
    <span class="meta">${v.provider} ${loc} · ${v.speakers.length} speaker${v.speakers.length === 1 ? '' : 's'}</span></span>`;
}

function esc(s) { return (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function renderCourse(c, verdict) {
  if (c.error) return `<div class="course"><h2>${c.course}</h2><p class="bad">${esc(c.error)}</p></div>`;
  const pod = (c.pods || [])[0] || { cast: { target: [], known: [] } };
  const cast = pod.cast;
  const notes = [];
  // The two things the ear cannot catch quickly but the data states plainly.
  if (cast.target.length !== 2) notes.push(`<p class="warn">Target side has ${cast.target.length} distinct voices — the rule is 2.</p>`);
  const tgtLang = c.course.split('_for_')[0];
  const locales = [...new Set(cast.target.map((v) => v.locale).filter(Boolean))];
  if (locales.length && !locales.some((l) => tgtLang.startsWith(l) || l.startsWith(tgtLang.slice(0, 2))))
    notes.push(`<p class="bad">Target voices are steered <b>${locales.join(', ')}</b> but the target language is <b>${tgtLang}</b>.</p>`);
  if (cast.deferred) notes.push(`<p class="warn">${cast.deferred} speakers deferred — no voice pool for this language.</p>`);
  if (!c.clips.length) notes.push(`<p class="warn">No sample audio generated for this course yet.</p>`);

  const clips = c.clips.map((cl) => `
    <div class="clip">
      <div class="who">${esc(cl.speaker)}</div>
      <div class="tgt">${esc(cl.target_text)}</div>
      <div class="knw">${esc(cl.known_text)}</div>
      <div class="row">
        ${cl.target ? `<button class="play" onclick="play(this,'/api/audio/${cl.target.id}')">▶ target</button>
          <span class="tag">${cl.target.voice_id || '?'} · ${cl.target.duration_ms || '?'}ms</span>` : ''}
        ${cl.known ? `<button class="play" onclick="play(this,'/api/audio/${cl.known.id}')">▶ known</button>` : ''}
      </div>
    </div>`).join('');

  const v = verdict || {};
  return `<div class="course">
    <h2>${c.course}</h2>
    <div class="cast">${cast.target.map(voiceChip).join('')}</div>
    <div class="cast">${cast.known.map(voiceChip).join('')}</div>
    ${notes.join('')}
    <div class="stats">${cast.speaker_count} speaker labels · ${c.with_target_audio}/${c.total_sentences} sentences have target audio · showing ${c.clips.length}</div>
    ${clips}
    <div class="verdict" data-course="${c.course}">
      <button class="approve ${v.verdict === 'approve' ? 'on' : ''}" onclick="rule(this,'approve')">Casting is right</button>
      <button class="reject ${v.verdict === 'reject' ? 'on' : ''}" onclick="rule(this,'reject')">Wrong — recast</button>
      <button class="unsure ${v.verdict === 'unsure' ? 'on' : ''}" onclick="rule(this,'unsure')">Not sure</button>
      <input class="note" placeholder="note (optional)" value="${esc(v.note)}">
      <span class="state">${v.verdict ? `${v.verdict} · ${new Date(v.at).toLocaleString()}` : 'no ruling yet'}</span>
    </div>
  </div>`;
}

async function rule(btn, verdict) {
  const box = btn.closest('.verdict');
  const course = box.dataset.course;
  const note = box.querySelector('.note').value;
  const r = await fetch('/api/verdict/' + course, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ verdict, note }),
  }).then((x) => x.json());
  box.querySelectorAll('button').forEach((b) => b.classList.remove('on'));
  btn.classList.add('on');
  box.querySelector('.state').textContent = `${r.verdict} · ${new Date(r.at).toLocaleString()}`;
}

fetch('/api/courses').then((r) => r.json()).then((d) => {
  document.getElementById('out').innerHTML =
    d.courses.map((c) => renderCourse(c, d.verdicts[c.course])).join('') || '<p>No courses.</p>';
}).catch((e) => { document.getElementById('out').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
