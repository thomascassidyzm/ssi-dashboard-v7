<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Option A — Prompter</title>
<link rel="stylesheet" href="shared.css">
<style>
/* OPTION A — PROMPTER. One viewport, one line, centred. The batch page and the live stage are the
   SAME layout: before Start the first line is already sitting big in the middle, and Start is
   where Next will be. Navigation is the Popty navbar + the one where-am-I row; both step aside
   while the mic is live, leaving a single status row (Stop · mic · count · Pause) with the
   progress bar as its bottom edge. The transport (‹ · Again · Next) is pinned to the bottom edge
   and is the only thing under the thumb. */
.status { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); position: relative; }
.status .count { font-size: 13px; font-weight: 700; color: #334155; margin-left: auto; white-space: nowrap; }
.status .edge { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #e5e9ef; }
.status .edge i { display: block; height: 100%; background: var(--green); transition: width .3s; }
.topbtn { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 600; color: #334155; white-space: nowrap; }
.center-line .crib { font-size: 18px; }
.paused .line-big, .paused .crib { color: var(--faint); }
.pnote { background: #eef0f3; border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; color: #334155; font-weight: 600; font-size: 14px; }
.hear { flex: none; display: flex; gap: 8px; align-items: center; padding: 6px 14px; font-size: 13px; color: var(--muted); max-width: 900px; width: 100%; margin: 0 auto; }
.hear .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.transport { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
.transport .in { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 60px 1fr 2fr; gap: 10px; }
.transport .in.one { grid-template-columns: 1fr; }
.transport .btn { padding: 16px 10px; font-size: 18px; }
.transport .next { font-size: 20px; }
.kbd { text-align: center; color: var(--faint); font-size: 12px; margin: 6px 0 0; }
@media (max-width: 899px) { .kbd { display: none; } }
@media (min-width: 900px) { .line-big { font-size: 50px; } }
.done-list { list-style: none; padding: 0; margin: 8px 0 0; overflow: auto; }
.done-list li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eceff3; font-size: 15px; }
.done-list li .t { flex: 1; min-width: 0; }
</style></head>
<body class="app">
<header class="app-navbar" id="nav"></header>
<div id="where"></div>
<div class="status hidden" id="status">
  <button class="topbtn" id="stop">Stop</button>
  <span class="mic" id="mic"><span class="dot"></span><span id="micw">Recording</span><canvas id="wave"></canvas></span>
  <span class="count" id="count"></span>
  <button class="topbtn" id="pause">Pause</button>
  <span class="edge"><i id="prog" style="width:0"></i></span>
</div>

<main class="fill" id="stage">
  <div class="center-line" id="cl">
    <div class="pnote hidden" id="pnote">Paused — nothing is being recorded. That attempt was thrown away.</div>
    <p class="kind" id="kind"></p>
    <p class="line-big" id="line"></p>
    <p class="crib" id="crib"></p>
  </div>
  <div class="hear" id="readymeta"><div class="meta" style="width:100%"><b>0 of 100</b><div class="bar"><i style="width:0"></i></div><span>about 25 min</span></div></div>
  <div class="hear hidden" id="hear"><span class="tt">Just read: <b id="lastt"></b></span><span class="take-state up" id="lasts">ON ITS WAY</span><button class="btn small" id="play">▶ Hear it</button></div>
</main>

<main class="fill hidden" id="done" style="padding:12px 16px; max-width:900px; margin:0 auto; width:100%">
  <h2 style="margin:4px 0" id="donehead"></h2>
  <p style="margin:0;color:var(--muted);font-size:14px">All saved. Hear any take, or read it again.</p>
  <ul class="done-list" id="donelist"></ul>
</main>

<div class="transport">
  <div class="in one" id="tready"><button class="btn primary next" id="go">Start recording</button>
    <p class="setline">Moves on when you stop · Phone mic · <button>Change</button></p></div>
  <div class="in hidden" id="tlive">
    <button class="btn" id="back" title="Back">‹</button>
    <button class="btn" id="again">Again</button>
    <button class="btn primary next" id="next">Next</button>
  </div>
  <div class="in one hidden" id="tdone"><button class="btn primary next">Carry on: batch 2 ›</button></div>
  <p class="kbd" id="kbd"><kbd>Space</kbd> next · <kbd>R</kbd> again · <kbd>B</kbd> back · <kbd>P</kbd> pause</p>
</div>
<div class="mock-tag">Option A · Prompter (mockup)</div>

<script src="lines.js"></script><script src="shared.js"></script>
<script>
const B = window.BOOTH, L = B.lines, $ = (id) => document.getElementById(id);
let i = 0, paused = false, last = -1, mode = 'ready', waveOn = false;
B.navbar($('nav'));
function render() {
  const n = B.recordedCount(), live = mode === 'live';
  B.wherebar($('where'), live, B.batchTotal - n);
  $('nav').classList.toggle('hidden', live);
  $('status').classList.toggle('hidden', !live);
  $('stage').classList.toggle('hidden', mode === 'done'); $('done').classList.toggle('hidden', mode !== 'done');
  $('tready').classList.toggle('hidden', mode !== 'ready'); $('tlive').classList.toggle('hidden', !live); $('tdone').classList.toggle('hidden', mode !== 'done');
  $('kbd').classList.toggle('hidden', !live); $('readymeta').classList.toggle('hidden', mode !== 'ready');
  $('count').textContent = `${n} of ${B.batchTotal}`; $('prog').style.width = (n / B.batchTotal * 100) + '%';
  $('kind').textContent = B.kindWords(L[i]); $('line').textContent = L[i].t; $('crib').textContent = L[i].k;
  $('mic').className = 'mic' + (paused ? ' paused' : ''); $('micw').textContent = paused ? 'Paused' : 'Recording';
  $('pause').textContent = paused ? 'Resume' : 'Pause'; $('next').textContent = paused ? 'Resume' : 'Next';
  $('again').disabled = paused; $('back').disabled = i === 0;
  $('cl').classList.toggle('paused', paused); $('pnote').classList.toggle('hidden', !paused);
  $('hear').classList.toggle('hidden', !(live && last >= 0));
  if (last >= 0) { $('lastt').textContent = L[last].t; const s = B.takes[last];
    $('lasts').className = 'take-state ' + (s === 'saved' ? 'saved' : 'up'); $('lasts').textContent = s === 'saved' ? 'SAVED' : 'ON ITS WAY'; }
  if (mode === 'done') { $('donehead').textContent = `You read ${n} lines`;
    $('donelist').innerHTML = Object.keys(B.takes).map((k) => `<li><span class="t">${B.esc(L[k].t)}</span><span class="take-state saved">SAVED</span><button class="btn small">▶</button><button class="btn small">Again</button></li>`).join(''); }
}
$('go').onclick = () => { mode = 'live'; render(); if (!waveOn) { B.wave($('wave'), () => !paused); waveOn = true; } };
$('next').onclick = () => { if (paused) { paused = false; return render(); } B.file(i, render); last = i; i = Math.min(i + 1, L.length - 1); render(); };
$('again').onclick = () => $('line').animate([{ opacity: .2 }, { opacity: 1 }], 400);
$('back').onclick = () => { if (i > 0) { i--; render(); } };
$('pause').onclick = () => { paused = !paused; render(); };
$('play').onclick = () => { $('play').textContent = '❚❚ Playing'; setTimeout(() => ($('play').textContent = '▶ Hear it'), 1600); };
$('stop').onclick = () => { mode = 'done'; paused = false; render(); };
document.addEventListener('keydown', (e) => { if (mode !== 'live') return;
  if (e.code === 'Space') { e.preventDefault(); $('next').click(); } if (e.key === 'r') $('again').click(); if (e.key === 'p') $('pause').click(); if (e.key === 'b') $('back').click(); });
render();
</script>
</body></html>
