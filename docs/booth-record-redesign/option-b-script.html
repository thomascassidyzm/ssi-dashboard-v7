<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Option B — Script</title>
<link rel="stylesheet" href="shared.css">
<style>
/* OPTION B — SCRIPT. The batch IS the page, like a script on a stand, one viewport tall. The line
   being read is a big highlighted card held in the CENTRE of the scrolling script; lines just read
   sit above it with their save state, the next ones below. The transport stays ABOVE the words
   (Aran, 2026-09-11) in one compact row. Navigation is the Popty navbar + the one where-am-I row;
   while live both step aside for a single status row. While the mic is live no row is tappable;
   Pause opens every read row's ▶ and Again. On desktop the batch's 100 squares sit in a left rail. */
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .cols { grid-template-columns: 240px minmax(0, 1fr); } .rail { display: block !important; } }
.rail { display: none; border-right: 1px solid var(--line); background: #fff; padding: 12px; overflow: auto; }
.rail h3 { margin: 0 0 2px; font-size: 14px; }
.rail p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.squares { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.squares i { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
.squares i.s { background: var(--green); border-color: var(--green); }
.squares i.u { background: #f3d58a; border-color: #e8c25d; }
.squares i.c { outline: 2px solid var(--ink); outline-offset: 1px; }
.main { display: flex; flex-direction: column; min-height: 0; }
.status { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); position: relative; }
.status .count { margin-left: auto; font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; }
.status .edge { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #e5e9ef; }
.status .edge i { display: block; height: 100%; background: var(--green); transition: width .3s; }
.ctl { flex: none; display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.ctl .btn { padding: 13px 8px; }
.ctl.one { grid-template-columns: 1fr; }
.pnote { flex: none; background: #eef0f3; padding: 7px 12px; font-size: 13px; font-weight: 600; color: #334155; }
.script { flex: 1; min-height: 0; overflow: auto; list-style: none; margin: 0; padding: 30vh 12px 30vh; scroll-behavior: smooth; }
.script li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; padding: 7px 6px; border-radius: 12px; align-items: start; }
.script li .no { color: var(--faint); font-size: 12px; padding-top: 3px; text-align: right; font-variant-numeric: tabular-nums; }
.script li .t { font-size: 16px; line-height: 1.35; color: var(--muted); }
.script li .k { display: block; font-size: 12px; color: var(--faint); margin-top: 1px; }
.script li.later .t { color: var(--faint); }
.script li .acts { display: flex; gap: 6px; align-items: center; }
.script li .acts .btn { display: none; }
body.paused .script li .acts .btn, body.ready .script li .acts .btn { display: inline-block; }
.script li.cur { background: #fff; border: 2px solid var(--green); padding: 16px 14px; margin: 8px 0; grid-template-columns: minmax(0, 1fr); }
.script li.cur .no { display: none; }
.script li.cur .t { font-size: clamp(26px, 6.6vw, 42px); line-height: 1.22; color: var(--ink); font-weight: 500; }
.script li.cur .k { font-size: 16px; color: var(--muted); margin-top: 8px; }
.script li.cur .kind { margin: 0 0 6px; }
body.ready .script { padding-top: 10px; }
body.paused .script li.cur { border-color: var(--line); }
body.paused .script li.cur .t { color: var(--faint); }
.foot { flex: none; display: flex; justify-content: center; gap: 14px; align-items: center; padding: 6px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); background: #fff; }
@media (max-width: 899px) { .foot .kbd { display: none; } .script li { grid-template-columns: 22px minmax(0, 1fr); } .script li .acts { grid-column: 2; } .script li .acts:empty { display: none; } .script li.cur { grid-template-columns: minmax(0,1fr); } }
</style></head>
<body class="app ready">
<header class="app-navbar" id="nav"></header>
<div id="where"></div>
<div class="cols">
  <aside class="rail"><h3>Batch 1 · 100 sentences</h3><p id="railp"></p><div class="squares" id="sq"></div></aside>
  <div class="main">
    <div class="status hidden" id="status">
      <span class="mic" id="mic"><span class="dot"></span><span id="micw">Recording</span><canvas id="wave"></canvas></span>
      <span class="count" id="count"></span><span class="edge"><i id="prog" style="width:0"></i></span>
    </div>
    <div class="ctl one" id="cta"><button class="btn primary" id="go">Start at line 1</button></div>
    <div class="ctl hidden" id="ctl"><button class="btn" id="pause">Pause</button><button class="btn" id="again">Again</button><button class="btn primary" id="next">Next</button></div>
    <div class="pnote hidden" id="pnote">Paused — nothing is being recorded. Tap ▶ or Again on any line you've read.</div>
    <ol class="script" id="script"></ol>
    <div class="foot"><span id="setl">Moves on when you stop · Phone mic · <b style="color:var(--green)">Change</b></span>
      <button class="btn small ghost hidden" id="stop">Stop here</button><span class="kbd"><kbd>Space</kbd> next · <kbd>R</kbd> again · <kbd>P</kbd> pause</span></div>
  </div>
</div>
<div class="mock-tag">Option B · Script (mockup)</div>
<script src="lines.js"></script><script src="shared.js"></script>
<script>
const B = window.BOOTH, L = B.lines, $ = (id) => document.getElementById(id);
let i = 0, state = 'ready', redo = null, waveOn = false;
B.navbar($('nav'));
function render() {
  const n = B.recordedCount(), live = state !== 'ready';
  document.body.className = 'app ' + state;
  B.wherebar($('where'), live, B.batchTotal - n);
  $('nav').classList.toggle('hidden', live); $('status').classList.toggle('hidden', !live);
  $('count').textContent = `${n} of ${B.batchTotal}`; $('prog').style.width = (n / B.batchTotal * 100) + '%';
  $('go').textContent = `Start at line ${i + 1}`; $('cta').classList.toggle('hidden', live); $('ctl').classList.toggle('hidden', !live);
  $('stop').classList.toggle('hidden', !live); $('setl').classList.toggle('hidden', live); $('pnote').classList.toggle('hidden', state !== 'paused');
  $('mic').className = 'mic' + (state === 'live' ? '' : ' paused'); $('micw').textContent = state === 'paused' ? 'Paused' : 'Recording';
  $('pause').textContent = state === 'paused' ? 'Resume' : 'Pause';
  $('again').disabled = $('next').disabled = state === 'paused';
  $('railp').textContent = `${n} recorded · ${B.batchTotal - n} to read`;
  $('sq').innerHTML = Array.from({ length: 100 }, (_, k) => `<i class="${B.takes[k] === 'saved' ? 's' : B.takes[k] ? 'u' : ''} ${k === i ? 'c' : ''}"></i>`).join('');
  $('script').innerHTML = L.map((l, k) => {
    const cls = k === i ? 'cur' : (B.takes[k] ? 'read' : (k > i ? 'later' : ''));
    const st = B.takes[k] ? `<span class="take-state ${B.takes[k] === 'saved' ? 'saved' : 'up'}">${B.takes[k] === 'saved' ? 'SAVED' : 'ON ITS WAY'}</span><button class="btn small" data-play="${k}">▶</button><button class="btn small" data-redo="${k}">Again</button>` : '';
    return `<li class="${cls}" id="row${k}"><span class="no">${k + 1}</span><span>${cls === 'cur' ? `<p class="kind">Line ${k + 1} · ${B.kindWords(l)}</p>` : ''}<span class="t">${B.esc(l.t)}</span><span class="k">${B.esc(l.k)}</span></span><span class="acts">${st}</span></li>`;
  }).join('');
  const cur = $('row' + i), sc = $('script');
  sc.scrollTop = cur.offsetTop - sc.offsetTop - (sc.clientHeight - cur.offsetHeight) / 2;
}
$('go').onclick = () => { state = 'live'; render(); if (!waveOn) { B.wave($('wave'), () => state === 'live'); waveOn = true; } };
$('next').onclick = () => { B.file(i, render); if (redo !== null) { i = redo; redo = null; } else i = Math.min(i + 1, L.length - 1); render(); };
$('again').onclick = () => document.querySelector('.cur .t').animate([{ opacity: .2 }, { opacity: 1 }], 400);
$('pause').onclick = () => { state = state === 'paused' ? 'live' : 'paused'; render(); };
$('script').onclick = (e) => {
  const r = e.target.closest('[data-redo]'), p = e.target.closest('[data-play]');
  if (p) { p.textContent = '❚❚'; setTimeout(() => (p.textContent = '▶'), 1500); }
  if (r) { redo = i; i = +r.dataset.redo; state = 'live'; render(); }
};
$('stop').onclick = () => { state = 'ready'; render(); };
document.addEventListener('keydown', (e) => { if (state === 'ready') return;
  if (e.code === 'Space') { e.preventDefault(); $('next').click(); } if (e.key === 'r') $('again').click(); if (e.key === 'p') $('pause').click(); });
render();
</script>
</body></html>
