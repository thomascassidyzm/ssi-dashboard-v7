<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Option C — Sets of ten</title>
<link rel="stylesheet" href="shared.css">
<style>
/* OPTION C — SETS OF TEN, one viewport tall. A 100-line batch is ten sets of ten. Inside a set:
   one line, big and centred on a card that fills the space, ten dots for where you are, and one
   round button that means "done, next". After the tenth line the mic switches OFF and a check
   screen lists the ten takes — hear any, read any again — before the next set. Navigation is the
   Popty navbar + the one where-am-I row; while live both step aside for a single status row.
   The ten sets are one slim strip, not a grid of tiles. */
.status { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
.status .count { margin-left: auto; font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; }
.topbtn { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 600; color: #334155; }
.strip { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; max-width: 900px; width: 100%; margin: 0 auto; }
.sets { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.sets i { height: 8px; border-radius: 4px; background: #e2e7ee; overflow: hidden; display: block; }
.sets i b { display: block; height: 100%; background: var(--green); }
.sets i.now { outline: 2px solid var(--green); outline-offset: 1px; }
.strip .lab { font-size: 13px; color: var(--muted); white-space: nowrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #dfe4ea; }
.dots i.d { background: var(--green); } .dots i.c { background: #fff; outline: 3px solid var(--green); }
.card { flex: 1; min-height: 0; margin: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; padding: 16px 20px; box-shadow: 0 4px 14px rgba(15,23,42,.05); max-width: 900px; width: calc(100% - 24px); align-self: center; overflow: auto; }
.foot { flex: none; display: flex; justify-content: center; align-items: center; gap: 22px; padding: 4px 16px calc(12px + env(safe-area-inset-bottom)); }
.round { width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 6px 16px rgba(8,120,87,.3); }
.round.wide { width: auto; height: auto; border-radius: 16px; padding: 18px 34px; }
.side { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 13px; color: #334155; }
.side.ghost { visibility: hidden; }
.kbd { text-align: center; color: var(--faint); font-size: 12px; margin: 0 0 6px; }
@media (max-width: 899px) { .kbd { display: none; } }
@media (min-width: 900px) { .line-big { font-size: 48px; } }
body.paused .card { opacity: .5; }
.pnote { flex: none; margin: 8px 12px 0; background: #eef0f3; border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 13px; color: #334155; text-align: center; }
.check { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px; max-width: 900px; width: 100%; margin: 0 auto; }
.check h2 { margin: 2px 0; font-size: 20px; }
.check .sub { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
.check ul { list-style: none; padding: 0; margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
.check li { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #eef1f4; }
.check li:last-child { border-bottom: 0; }
.check li .no { color: var(--faint); font-size: 12px; }
.check li .t { font-size: 14px; line-height: 1.3; }
.check li .a { display: flex; gap: 6px; align-items: center; }
@media (max-width: 899px) { .check li .take-state { display: none; } }
</style></head>
<body class="app">
<header class="app-navbar" id="nav"></header>
<div id="where"></div>
<div class="status hidden" id="status">
  <span class="mic" id="mic"><span class="dot"></span><span id="micw">Recording</span><canvas id="wave"></canvas></span>
  <span class="count" id="count"></span><button class="topbtn" id="pause">Pause</button>
</div>
<div class="strip" id="strip"><span class="lab" id="lab"></span><div class="sets" id="sets"></div></div>
<div class="strip hidden" id="dstrip" style="justify-content:center"><div class="dots" id="dots"></div><span class="lab" id="dlab"></span></div>
<div class="pnote hidden" id="pnote">Paused — nothing is being recorded. Resume reads this line again from the start.</div>
<div class="card" id="card"><p class="kind" id="kind"></p><p class="line-big" id="line"></p><p class="crib" id="crib"></p></div>
<div class="check hidden" id="check"><h2 id="checkhead"></h2><p class="sub">Microphone off. Hear any take, or read one again.</p><ul id="checklist"></ul></div>
<div class="foot" id="foot"><button class="side" id="again">Again</button><button class="round" id="next">Next</button><button class="side ghost">·</button></div>
<div class="foot" id="foot2"><button class="btn primary round wide" id="go">Start set 1</button></div>
<p class="kbd hidden" id="kbd"><kbd>Space</kbd> next · <kbd>R</kbd> again · <kbd>P</kbd> pause</p>
<div class="mock-tag">Option C · Sets of ten (mockup)</div>

<script src="lines.js"></script><script src="shared.js"></script>
<script>
const B = window.BOOTH, L = B.lines, $ = (id) => document.getElementById(id);
let i = 0, paused = false, redoing = null, waveOn = false, mode = 'ready', checkSet = 0;
B.navbar($('nav'));
function render() {
  const n = B.recordedCount(), live = mode === 'live', pos = i % 10, set = Math.floor(i / 10);
  B.wherebar($('where'), live, B.batchTotal - n);
  $('nav').classList.toggle('hidden', live); $('status').classList.toggle('hidden', !live);
  $('strip').classList.toggle('hidden', live); $('dstrip').classList.toggle('hidden', !live);
  $('card').classList.toggle('hidden', mode === 'check'); $('check').classList.toggle('hidden', mode !== 'check');
  $('foot').classList.toggle('hidden', !live); $('foot2').classList.toggle('hidden', live); $('kbd').classList.toggle('hidden', !live);
  $('lab').textContent = `Set ${set + 1} of 10`;
  $('sets').innerHTML = Array.from({ length: 10 }, (_, s) => { const got = Object.keys(B.takes).filter((k) => Math.floor(k / 10) === s).length;
    return `<i class="${s === set ? 'now' : ''}"><b style="width:${got * 10}%"></b></i>`; }).join('');
  $('dots').innerHTML = Array.from({ length: 10 }, (_, k) => `<i class="${k < pos ? 'd' : (k === pos ? 'c' : '')}"></i>`).join('');
  $('dlab').textContent = redoing !== null ? `Reading line ${pos + 1} again` : `Set ${set + 1} · line ${pos + 1} of 10`;
  $('count').textContent = `${n} of ${B.batchTotal}`;
  $('kind').textContent = B.kindWords(L[i]); $('line').textContent = L[i].t; $('crib').textContent = L[i].k;
  $('mic').className = 'mic' + (paused ? ' paused' : ''); $('micw').textContent = paused ? 'Paused' : 'Recording';
  $('pause').textContent = paused ? 'Resume' : 'Pause'; document.body.classList.toggle('paused', paused);
  $('pnote').classList.toggle('hidden', !paused); $('next').textContent = paused ? 'Resume' : 'Next'; $('again').disabled = paused;
  $('go').textContent = mode === 'check' ? `Sounds right — start set ${checkSet + 2}` : `Start set ${set + 1}`;
  if (mode === 'check') {
    $('checkhead').textContent = `Set ${checkSet + 1} done — ten takes`;
    $('checklist').innerHTML = L.slice(checkSet * 10, checkSet * 10 + 10).map((l, j) => { const k = checkSet * 10 + j, st = B.takes[k];
      return `<li><span class="no">${j + 1}</span><span class="t">${B.esc(l.t)}</span><span class="a"><span class="take-state ${st === 'saved' ? 'saved' : 'up'}">${st === 'saved' ? 'SAVED' : 'ON ITS WAY'}</span><button class="btn small" data-play>▶</button><button class="btn small" data-redo="${k}">Again</button></span></li>`; }).join('');
  }
}
function startLive() { mode = 'live'; render(); if (!waveOn) { B.wave($('wave'), () => !paused); waveOn = true; } }
$('go').onclick = startLive;
$('next').onclick = () => {
  if (paused) { paused = false; return render(); }
  B.file(i, render);
  if (redoing !== null) { i = redoing; redoing = null; mode = 'check'; return render(); }
  i++; if (i % 10 === 0) { checkSet = i / 10 - 1; mode = 'check'; } render();
};
$('again').onclick = () => $('line').animate([{ opacity: .2 }, { opacity: 1 }], 400);
$('pause').onclick = () => { paused = !paused; render(); };
$('checklist').onclick = (e) => { const r = e.target.closest('[data-redo]'), p = e.target.closest('[data-play]');
  if (p) { p.textContent = '❚❚'; setTimeout(() => (p.textContent = '▶'), 1500); }
  if (r) { redoing = i; i = +r.dataset.redo; startLive(); } };
document.addEventListener('keydown', (e) => { if (mode !== 'live') return;
  if (e.code === 'Space') { e.preventDefault(); $('next').click(); } if (e.key === 'r') $('again').click(); if (e.key === 'p') $('pause').click(); });
render();
</script>
</body></html>
