<style>

  .warn { background:#fbecea; color:var(--accent); border-radius:12px; padding:10px 12px; font-size:13px; margin-top:10px; display:none; }

const D = {"title":"Southern Welsh (colloquial De Cymru Welsh) Listening Pods — Pod 1","visibility":"held","scenes":{"1":"Scene 1 · 8 am","2":"Scene 2","3":"Scene 3 · 3 pm","4":"Scene 4 · 7 pm","5":"Scene 5 · 10:30 pm","6":"Scene 6","7":"Scene 7","8":"Scene 8","9":"Scene 9","10":"Scene 10","11":"Scene 11","12":"Scene 12","13":"Scene 13","14":"Scene 14","15":"Scene 15","16":"Scene 16","17":"Scene 17","18":"Scene 18","19":"Scene 19","20":"Scene 20","21":"Scene 21","22":"Scene 22"},"lines":[{"n":1,"sc":1,"sp":"Neighbour","c":0,"cy":"Bore da, Siân!","en":"Good morning, Siân!","t":"8b5c365e-e5b4-421c-8287-ffadea46405d","k":"57a110e2-c32d-459d-94e8-a0beae4d2ebf","td":1.651,"kd":1.625,"ts":true,"j":false,"bad":[]},{"n":2,"sc":1,"sp":"Sarah","c":1,"cy":"Bore da. Sut wyt ti?","en":"Good morning. How are you?","t":"182c2fc1-b04d-41ce-935e-d93070debbe6","k":"37a8f6e1-d8a9-4ec0-8c4d-30ccafe3a7ff","td":2.495,"kd":1.773,"ts":true,"j":false,"bad":[]},{"n":3,"sc":1,"sp":"Neighbour","c":0,"cy":"Dw i'n dda iawn, diolch. Ti'n mynd i'r gwaith?","en":"I'm very well, thank you. Are you going to work?","t":"46deff61-a45c-4be9-9bfb-fe40de4e25f8","k":"c1c42f2f-1a46-4272-ad9e-815b15d6b3b0","td":2.881,"kd":3.087,"ts":true,"j":false,"bad":[]},{"n":4,"sc":1,"sp":"Sarah","c":1,"cy":"Ydw… mae diwrnod prysur 'da fi heddiw. Gobeithio cei di ddiwrnod da. Wela i di wedyn.","en":"Yes, I've got a busy day today. I hope you have a good day. See you later.","t":"92e512d2-6970-4212-80da-78f5c0b56b05","k":"4c4caf6b-59a8-4b95-8d22-cb2d0547620e","td":9.995,"kd":4.608,"ts":true,"j":false,"bad":[]},{"n":5,"sc":2,"sp":"Sarah","c":1,"cy":"Esgusodwch fi,… ydy'r sedd yma… wedi'i chymryd?","en":"Excuse me, is this seat taken?","t":"1a4d3b09-d92e-447b-875a-22f35bb674b9","k":"25520e7b-0694-41c4-9907-5d80a833b0b1","td":4.451,"kd":2.424,"ts":true,"j":false,"bad":[]},{"n":6,"sc":2,"sp":"Passenger","c":2,"cy":"Nac ydy, mae hi'n rhydd. Croeso i chi eistedd.","en":"No, it's free. Please, go ahead.","t":"57e338d8-a516-4156-a7a7-a004704f2daf","k":"c6bffd16-cb80-42d6-937a-c1e1c9b5f610","td":3.289,"kd":2.303,"ts":true,"j":false,"bad":[]},{"n":7,"sc":2,"sp":"Sarah","c":1,"cy":"Pa mor bell yw hi i'r dre?","en":"How far is it into town?","t":"292155e5-d062-4832-9c3b-51b650d407bb","k":"dea6053e-d0f4-43b3-a79e-910a2cc32834","td":2.63,"kd":1.68,"ts":true,"j":false,"bad":[]},{"n":8,"sc":2,"sp":"Sarah","c":1,"cy":"Allwch chi weud wrtha i… pa mor bell yw hi i'r dre?","en":"Can you tell me how far it is into town?","t":"e012071d-ea95-41d0-b539-e33151e07cea","k":"4617f844-22c9-456c-96cc-08f0041aaa01","td":4.224,"kd":2.424,"ts":false,"j":false,"bad":[]},{"n":9,"sc":2,"sp":"Passenger","c":2,"cy":"Dyw hi ddim yn bell iawn. Falle tair neu bedair milltir.","en":"It's not very far. Maybe three or four miles.","t":"a6157bbf-39b8-4cbf-a4b8-e0577669d119","k":"8bd0d03d-280b-415e-8878-d8ac6831eeac","td":3.778,"kd":3.076,"ts":true,"j":false,"bad":[]},{"n":10,"sc":3,"sp":"Barista","c":3,"cy":"Prynhawn da. Beth alla i gael i chi?","en":"Good afternoon. What can I get you?","t":"cf81ad76-f7be-4636-a2df-724fa16cd5cb","k":"fbd3d17a-c712-43d1-a549-b6fc8d85baae","td":2.545,"kd":2.238,"ts":true,"j":false,"bad":[]},{"n":11,"sc":3,"sp":"Sarah","c":1,"cy":"Prynhawn da. Licen i goffi,… os gwelwch yn dda. Gyda llaeth ond heb siwgr. I fynd.","en":"Good afternoon. … I'd like a coffee, please. … With milk but with no sugar. … To take away.","t":"ba348535-2cd2-4975-8745-dacbd2c49209","k":"84fea07c-6eec-4170-a617-092ba66c90fd","td":6.462,"kd":6.324,"ts":true,"j":false,"bad":[]},{"n":12,"sc":3,"sp":"Sarah","c":1,"cy":"Oes bwyd 'da chi?","en":"Do you have any food?","t":"abd6ecab-f675-4ca4-aad2-2bd9f432468c","k":"f825c5aa-14f3-48bb-9f29-b62ef95c1a10","td":1.839,"kd":1.32,"ts":false,"j":false,"bad":[]},{"n":13,"sc":3,"sp":"Sarah","c":1,"cy":"Oes snacs 'da chi?","en":"Do you have any snacks?","t":"48d1f311-ed63-4771-ae40-193f58472250","k":"a678033f-b939-4257-b9c2-977d1d0fea39","td":2.28,"kd":1.656,"ts":false,"j":false,"bad":[]},{"n":14,"sc":3,"sp":"Sarah","c":1,"cy":"Oes creision 'da chi,… neu gnau,… neu rywbeth?","en":"Do you have crisps, or nuts, or anything?","t":"f60b6099-babc-404e-bb9b-92fe4c058aa7","k":"4008eccc-54fb-4451-ae0c-fdca27ca3ba0","td":4.069,"kd":2.544,"ts":false,"j":false,"bad":[]},{"n":15,"sc":3,"sp":"Barista","c":3,"cy":"Nag oes, dim ond diodydd… sy 'da ni.","en":"No, we've only got drinks.","t":"f19a15dc-0cff-41c6-97e1-5ad80e89cb56","k":"118e0b38-e39d-4a4e-a46f-907ccc7ed217","td":2.633,"kd":2.002,"ts":true,"j":false,"bad":[]},{"n":16,"sc":3,"sp":"Barista","c":3,"cy":"Oes,… licech chi'r fwydlen?","en":"Yes, would you like the menu?","t":"92d1b63a-8bf6-491b-a991-ff46cbc108ef","k":"adb4aceb-0c37-4b71-9e3a-4bb76df1f8ca","td":2.052,"kd":1.9,"ts":false,"j":false,"bad":[]},{"n":17,"sc":3,"sp":"Sarah","c":1,"cy":"Ie, os gwelwch yn dda.","en":"Yes, please.","t":"9e2ff6fb-5463-430f-941f-3fa928d70157","k":"cab9f16a-f67e-45dc-85d9-511a068cc14c","td":1.573,"kd":1.464,"ts":true,"j":false,"bad":[]},{"n":18,"sc":3,"sp":"Barista","c":3,"cy":"Dyma'ch coffi chi.","en":"Here's your coffee.","t":"efb1d68b-5420-49a0-b31d-67042e5c328c","k":"c6256c73-a0a8-4b59-9fe8-d7c8eafa1070","td":1.592,"kd":1.381,"ts":true,"j":false,"bad":[]},{"n":19,"sc":3,"sp":"Sarah","c":1,"cy":"Diolch yn fawr iawn. Hwyl.","en":"Thank you very much. … Goodbye.","t":"f41da9a5-015d-4a41-bfd9-273ea0b27541","k":"e7455b6c-2ec9-40c1-93e9-a77271838360","td":2.606,"kd":1.8,"ts":true,"j":false,"bad":[]},{"n":20,"sc":4,"sp":"Friend","c":4,"cy":"Helo, noswaith dda!","en":"Hello, good evening!","t":"fc04c705-65fb-4b1d-a2fe-feec59b0af58","k":"694ff52f-978a-409f-a388-07ccd9eb1232","td":1.836,"kd":1.6,"ts":true,"j":false,"bad":[]},{"n":21,"sc":4,"sp":"Sarah","c":1,"cy":"Helo! Mae'n ddrwg 'da fi… ond alla i ddim siarad… ar hyn o bryd. Ma rhaid i fi fynd adre nawr. Allwn ni siarad fory?","en":"Hello! … I'm sorry but I can't talk at the moment. … I need to go home now. … Can we talk tomorrow?","t":"caa48a7f-127a-49e1-ad4f-982206c4f291","k":"71ea72b8-6c76-4fa6-9bbc-f832714cfa37","td":8.515,"kd":6.168,"ts":true,"j":false,"bad":[]},{"n":22,"sc":4,"sp":"Friend","c":4,"cy":"Na, mae'n ddrwg 'da fi,… dw i'n brysur fory. Ond gad i ni siarad… ddydd Sadwrn. Wela i di bryd hynny.","en":"No, I'm sorry, I'm busy tomorrow. But let's talk on Saturday. See you then.","t":"5e93757e-d6e7-482b-9558-c20e3c94e469","k":"10b6cc13-8939-4345-9243-ba3e0303e76b","td":6.032,"kd":4.69,"ts":true,"j":false,"bad":[]},{"n":23,"sc":5,"sp":"Neighbour","c":0,"cy":"Noswaith dda, Siân. Gest ti ddiwrnod hir?","en":"Good evening, Siân. Did you have a long day?","t":"ea96d340-c3a6-445a-a6ed-e13a02ed9bad","k":"faf70009-e829-41b5-9459-e8466050cec0","td":2.922,"kd":2.759,"ts":true,"j":false,"bad":[]},{"n":24,"sc":5,"sp":"Sarah","c":1,"cy":"Do, hir iawn. Dw i wedi… blino'n ofnadwy nawr. Nos da. Wela i di fory.","en":"Yes, very. … I'm very tired now. … Good night. … See you tomorrow.","t":"120b50f4-aed8-41fe-83e8-f12150e48f03","k":"74ef399f-2978-48c3-b15d-7a20f5a41db1","td":7.358,"kd":5.328,"ts":true,"j":false,"bad":[]},{"n":25,"sc":6,"sp":"James","c":5,"cy":"Esgusodwch fi. Helo. Beth yw eich enw chi?","en":"Excuse me. Hello. What's your name?","t":"bef8682a-d934-4a83-bfb5-674080f67e6e","k":"742b151f-20a5-42e2-8091-1e57fc6b991b","td":3.325,"kd":3.05,"ts":true,"j":false,"bad":[]},{"n":26,"sc":6,"sp":"Anna","c":0,"cy":"Anna yw fy enw i. A chi?","en":"My name is Anna. … And you?","t":"f41e2d6a-7e41-45c7-b33f-0e80767b5d7f","k":"66015d91-82a7-4eb6-9af5-a4ba9b2066e4","td":2.921,"kd":1.872,"ts":true,"j":false,"bad":[]},{"n":27,"sc":6,"sp":"James","c":5,"cy":"James dw i. Neis cwrdd â chi.","en":"I'm James. Pleased to meet you.","t":"495f173a-1a1e-479d-adca-33d521bd7b02","k":"b9c17fe6-596a-4e88-b815-824ef0536d54","td":2.53,"kd":2.523,"ts":true,"j":false,"bad":[]},{"n":28,"sc":6,"sp":"Anna","c":0,"cy":"Neis cwrdd â chi 'fyd. O ble dych chi'n dod?","en":"Pleased to meet you too. … Where are you from?","t":"231a213d-0cbc-4dde-80ee-f546b82f0fc4","k":"6356cf27 function start() { playing = true; $('play').textContent = '❚❚'; if (a.getAttribute('src') && a.currentTime > 0 && !a.ended) a.play().catch(() => playStep()); else playStep(); }
function stop() { clearWatch(); playing = false; $('play').textContent = '▶'; a.pause(); }
function jump(i) { idx = Math.max(0, Math.min(L.length - 1, i)); step = 0; show(); if (playing) playStep(); else a.removeAttribute('src'); }
$('play').onclick = () => playing ? stop() : start();
$('prev').onclick = () => jump(idx - 1);
$('next').onclick = () => jump(idx + 1);
$('list').onclick = (e) => { const r = e.target.closest('.ln'); if (r) { const i = +r.dataset.i; if (!playing) { playing = true; $('play').textContent = '❚❚'; } jump(i); } };
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.m; localStorage.setItem('cyms-pod1-mode', mode); setModes(); recalc(); step = 0; show(); if (playing) playStep(); });
const setModes = () => document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', start);
  navigator.mediaSession.setActionHandler('pause', stop);
  navigator.mediaSession.setActionHandler('previoustrack', () => jump(idx - 1));
  navigator.mediaSession.setActionHandler('nexttrack', () => jump(idx + 1));
}
recalc(); setModes(); render(); if (idx >= L.length) idx = 0; show();
</script>
</body>
</html>
